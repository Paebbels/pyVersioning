name: Pipeline

on:
  push:
  workflow_dispatch:
  schedule:
# Every Friday at 22:00 - rerun pipeline to check for dependency-based issues
    - cron: '0 22 * * 5'

permissions:
  actions:  write
  contents: write
  pages:    write
  id-token: write

jobs:
  Prepare:
    uses: pyTooling/Actions/.github/workflows/PrepareJob.yml@r9

  ConfigParams:
    uses: pyTooling/Actions/.github/workflows/ExtractConfiguration.yml@r9

  UnitTestingParams:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r9
    with:
      package_name:        'pyVersioning'
      python_version_list: '3.11 3.12 3.13 3.14 3.15'
      disable_list:        'windows-arm:pypy-3.11 windows-arm:3.13'

  AppTestingParams:
    uses: pyTooling/Actions/.github/workflows/Parameters.yml@r9
    with:
      name:                'pyVersioning'
      python_version_list: '3.11 3.12 3.13 3.14 3.15'
      system_list:         'ubuntu ubuntu-arm macos macos-arm windows windows-arm'

  VersionCheck:
    uses: pyTooling/Actions/.github/workflows/CheckReleaseVersion.yml@r9
    needs:
      - Prepare
      - UnitTestingParams
    if: needs.Prepare.outputs.version != ''
    with:
      python_version:       ${{ needs.UnitTestingParams.outputs.python_version }}
      version:              ${{ needs.Prepare.outputs.version }}
      package_version:      ${{ needs.UnitTestingParams.outputs.package_version }}
      check_pypi_duplicate: ${{ needs.Prepare.outputs.is_release_commit }}
      pypi_package:         ${{ needs.UnitTestingParams.outputs.package_fullname }}

  UnitTesting:
    uses: pyTooling/Actions/.github/workflows/UnitTesting.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
    with:
      jobs:                     ${{ needs.UnitTestingParams.outputs.python_jobs }}
      pacboy:                   "msys/git"
      unittest_report_xml:      ${{ needs.ConfigParams.outputs.unittest_report_xml }}
      coverage_report_xml:      ${{ needs.ConfigParams.outputs.coverage_report_xml }}
      coverage_report_json:     ${{ needs.ConfigParams.outputs.coverage_report_json }}
      coverage_report_html:     ${{ needs.ConfigParams.outputs.coverage_report_html }}
      unittest_xml_artifact:    ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      coverage_sqlite_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_sqlite }}

  StaticTypeCheck:
    uses: pyTooling/Actions/.github/workflows/StaticTypeCheck.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      html_report:    ${{ needs.ConfigParams.outputs.typing_report_html }}
      html_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).statictyping_html }}

  CodeQuality:
    uses: pyTooling/Actions/.github/workflows/CheckCodeQuality.yml@r9
    needs:
      - UnitTestingParams
      - PublishTestResults   # artificial dependency to delay start when pipeline has free job resources
    if: ${{ !cancelled() }}  # the artificial dependency above is for ordering only and must not gate this job
    with:
      python_version:    ${{ needs.UnitTestingParams.outputs.python_version }}
      package_directory: ${{ needs.UnitTestingParams.outputs.package_directory }}
      pylint:            'false'
      artifact:          CodeQuality

  DocCoverage:
    uses: pyTooling/Actions/.github/workflows/CheckDocumentation.yml@r9
    needs:
      - UnitTestingParams
      - StaticTypeCheck      # artificial dependency to delay start when pipeline has free job resources
    if: ${{ !cancelled() }}  # the artificial dependency above is for ordering only and must not gate this job
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      directory:      ${{ needs.UnitTestingParams.outputs.package_directory }}

  Package:
    uses: pyTooling/Actions/.github/workflows/Package.yml@r9
    needs:
      - UnitTestingParams
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      artifact:       ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}

  AppTesting:
    uses: pyTooling/Actions/.github/workflows/ApplicationTesting.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
      - AppTestingParams
      - Package
    with:
      jobs:                 ${{ needs.AppTestingParams.outputs.python_jobs }}
      wheel:                ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
      apptest_report_xml:   ${{ needs.ConfigParams.outputs.unittest_report_xml }}
      apptest_xml_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).apptesting_xml }}

  Examples:
    runs-on: ubuntu-26.04
    needs:
      - UnitTestingParams
      - Package
    strategy:
      fail-fast: false
      matrix:
        example: ["C", "CXX"]
    defaults:
      run:
        shell: bash
    steps:
      - name: ⏬ Checkout repository
        uses: actions/checkout@v7

      - name: 📥 Download artifacts '${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}' from 'Package' job
        uses: pyTooling/download-artifact@v8
        with:
          name: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
          path: install

      - name: 🔧 Install wheel from artifact (Ubuntu/macOS)
        run: |
          ls -l install
          python -m pip install -U --disable-pip-version-check --break-system-packages install/*.whl

      - name: Generate versioning.${{ matrix.fileext }}
        run: |
          cd example
          ./fillout.sh ${{ matrix.example }}

      - name: Compile example
        run: |
          cd example
          ./build.sh ${{ matrix.example }}

      - name: Execute example
        run: |
          cd example
          ./run.sh ${{ matrix.example }}

      - name: Check example
        run: |
          cd example
          ./check.sh ${{ matrix.example }}

  PublishCoverageResults:
    uses: pyTooling/Actions/.github/workflows/PublishCoverageResults.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
      - UnitTesting
    if: ${{ !cancelled() }}  # not 'success() || failure()', because that's false if a dependency was skipped
    with:
      coverage_report_json:   ${{ needs.ConfigParams.outputs.coverage_report_json }}
      coverage_report_html:   ${{ needs.ConfigParams.outputs.coverage_report_html }}
      coverage_json_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}
      coverage_html_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}
      codecov:                'true'
      codacy:                 'true'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_TOKEN:  ${{ secrets.CODACY_TOKEN }}

  PublishTestResults:
    uses: pyTooling/Actions/.github/workflows/PublishTestResults.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
      - UnitTesting
      - AppTesting
    if: ${{ !cancelled() }}  # not 'success() || failure()', because that's false if a dependency was skipped
    with:
      additional_merge_args: '"--pytest=rewrite-dunder-init;reduce-depth:pytest.tests.unit;reduce-depth:pytest.tests.app" --render=tree'
      testsuite-summary-name: ${{ needs.UnitTestingParams.outputs.package_fullname }}
      merged_junit_filename:  ${{ fromJson(needs.ConfigParams.outputs.unittest_merged_report_xml).filename }}
      merged_junit_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      dorny:                  'true'
      codecov:                'true'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

#  VerifyDocs:
#    uses: pyTooling/Actions/.github/workflows/VerifyDocs.yml@r9
#    needs:
#      - UnitTestingParams
#    with:
#      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}

  Documentation:
    uses: pyTooling/Actions/.github/workflows/SphinxDocumentation.yml@r9
    needs:
      - ConfigParams
      - UnitTestingParams
      - PublishTestResults
      - PublishCoverageResults
#      - VerifyDocs
    if: ${{ !cancelled() }}  # not 'success() || failure()', because that's false if a dependency was skipped
    with:
      python_version:         ${{ needs.UnitTestingParams.outputs.python_version }}
      coverage_report_json:   ${{ needs.ConfigParams.outputs.coverage_report_json }}
      unittest_xml_artifact:  ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).unittesting_xml }}
      coverage_json_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_json }}
      html_artifact:          ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_html }}
      latex_artifact:         ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_latex }}

  IntermediateCleanUp:
    uses: pyTooling/Actions/.github/workflows/CleanupArtifacts.yml@r9
    needs:
      - UnitTestingParams
      - UnitTesting
      - AppTesting
      - PublishCoverageResults
      - PublishTestResults
    if: ${{ !cancelled() }}
    with:
      json: ${{ needs.UnitTestingParams.outputs.artifact_names }}
      artifact-json-ids: >-
        codecoverage_sqlite:-*
        unittesting_xml:-*
        apptesting_xml:-*

  PDFDocumentation:
    uses: pyTooling/Actions/.github/workflows/LaTeXDocumentation.yml@r9
    needs:
      - UnitTestingParams
      - Documentation
    with:
      document:       ${{ needs.UnitTestingParams.outputs.package_fullname }}
      latex_artifact: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_latex }}
      pdf_artifact:   ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_pdf }}
      can-fail:       'true'

  PublishToGitHubPages:
    uses: pyTooling/Actions/.github/workflows/PublishToGitHubPages.yml@r9
    needs:
      - Prepare
      - UnitTestingParams
      - Documentation
#      - PDFDocumentation
      - PublishCoverageResults
      - StaticTypeCheck
    if: >-
      !failure() && !cancelled()
       && needs.Documentation.result == 'success'
       && needs.PublishCoverageResults.result == 'success'
       && needs.StaticTypeCheck.result == 'success'
       && needs.Prepare.outputs.publish_pages == 'true'
    with:
      doc:      ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).documentation_html }}
      coverage: ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).codecoverage_html }}
      typing:   ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).statictyping_html }}

  TriggerTaggedRelease:
    uses: pyTooling/Actions/.github/workflows/TagReleaseCommit.yml@r9
    needs:
      - Prepare
      - VersionCheck
      - UnitTesting
      - AppTesting
      - Examples
#      - StaticTypeCheck
      - Package
      - PublishToGitHubPages
    if: >-
      !failure() && !cancelled()
       && needs.Prepare.outputs.is_release_commit == 'true'
       && needs.VersionCheck.result == 'success'
       && github.event_name != 'schedule'
    permissions:
      contents: write  # required for create tag
      actions:  write  # required for trigger workflow
    with:
      version:        ${{ needs.Prepare.outputs.version }}
      auto_tag:       ${{ needs.Prepare.outputs.is_release_commit }}
      pypi_compliant: ${{ needs.Package.outputs.pypi_compliant }}
    secrets: inherit

  ReleasePage:
    uses: pyTooling/Actions/.github/workflows/PublishReleaseNotes.yml@r9
    needs:
      - Prepare
      - VersionCheck
      - AppTesting
      - Examples
#      - StaticTypeCheck
      - Package
      - PublishToGitHubPages
    if: >-
      !failure() && !cancelled()
       && needs.Prepare.outputs.is_release_tag == 'true'
       && needs.VersionCheck.result == 'success'
    permissions:
      contents: write
      actions:  write
    with:
      tag:        ${{ needs.Prepare.outputs.version }}
      prerelease: ${{ needs.Prepare.outputs.is_prerelease == 'true' }}
      latest:     ${{ needs.Prepare.outputs.is_prerelease != 'true' }}
    secrets: inherit

  PublishOnPyPI:
    uses: pyTooling/Actions/.github/workflows/PublishOnPyPI.yml@r9
    needs:
      - Prepare
      - VersionCheck
      - UnitTestingParams
      - Package
      - ReleasePage
    if: >-
      !failure() && !cancelled()
       && needs.Package.result == 'success'
       && needs.Prepare.outputs.is_release_tag == 'true'
       && needs.VersionCheck.result == 'success'
    with:
      python_version: ${{ needs.UnitTestingParams.outputs.python_version }}
      requirements:   '-r dist/requirements.txt'
      artifact:       ${{ fromJson(needs.UnitTestingParams.outputs.artifact_names).package_all }}
      pypi_compliant: ${{ needs.Package.outputs.pypi_compliant }}
    secrets:
      PYPI_TOKEN:    ${{ secrets.PYPI_TOKEN }}

  ArtifactCleanUp:
    uses: pyTooling/Actions/.github/workflows/CleanupArtifacts.yml@r9
    needs:
      - Prepare
      - UnitTestingParams
      - UnitTesting
      - StaticTypeCheck
      - Documentation
      - PDFDocumentation
      - PublishTestResults
      - PublishCoverageResults
      - PublishToGitHubPages
      - IntermediateCleanUp
    if: ${{ !cancelled() }}
    with:
      json: ${{ needs.UnitTestingParams.outputs.artifact_names }}
      artifact-json-ids: >-
        unittesting_html:-*
        codecoverage_xml:-*
        codecoverage_json:-*
        codecoverage_html:-*
        unittesting_xml
        unittesting_html
        codecoverage_sqlite
        codecoverage_xml
        codecoverage_json
        codecoverage_html
        statictyping_html
        documentation_html
        documentation_latex
        #documentation_pdf
      json2:      ${{ needs.UnitTestingParams.outputs.artifact_names }}
      condition2: ${{ needs.Prepare.outputs.is_release_tag != 'true' }}
      artifact-json-ids2: >-
        package_all
      others: |
        github-pages
